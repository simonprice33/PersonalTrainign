name: Build, Test & Deploy

# Production-only pipeline (there is no dev site). A merge/push to main builds the React frontend,
# runs the backend unit tests, then deploys to the live site on this server's self-hosted runner.
# PRs only run build-and-test so the required status check can report.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ptsite-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: [self-hosted, Windows, ptsite]
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      SITE_ROOT: C:\Sites\simonprice-pt.co.uk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Backend unit tests
        working-directory: backend
        run: npm run test:unit

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # The frontend env files hold the public build-time keys (reCAPTCHA site key, Stripe publishable key)
      # and are not in git, so reuse the ones kept on this server.
      - name: Provide frontend build environment
        run: |
          Get-ChildItem -Path (Join-Path $env:SITE_ROOT 'frontend') -Force -Filter '.env*' -File |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $env:GITHUB_WORKSPACE 'frontend') -Force }

      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: https://www.simonprice-pt.co.uk
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, ptsite]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      SITE_ROOT: C:\Sites\simonprice-pt.co.uk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ${{ runner.temp }}/frontend-build

      - name: Deploy to production
        run: .github/scripts/deploy.ps1 -RepoRoot "$env:GITHUB_WORKSPACE" -BuildDir "${{ runner.temp }}/frontend-build" -SiteRoot "$env:SITE_ROOT"

      - name: Smoke test
        run: |
          $api = Invoke-WebRequest -Uri 'http://127.0.0.1:3001/api/health' -UseBasicParsing -TimeoutSec 30
          if ($api.StatusCode -ne 200) { throw "API health returned $($api.StatusCode)" }
          $site = Invoke-WebRequest -Uri 'https://www.simonprice-pt.co.uk/' -UseBasicParsing -TimeoutSec 30
          if ($site.StatusCode -ne 200) { throw "Site returned $($site.StatusCode)" }
